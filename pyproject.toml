[project]
name = "comfyui"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  # https://github.com/Comfy-Org/ComfyUI/blob/a277b5bf213e8a44fa34817b7770b54f86ef4cea/requirements.txt
  "comfyui-frontend-package==1.59.6",
  "comfyui-workflow-templates==0.11.111",
  "comfyui-embedded-docs==0.5.17",
  "torch",
  "torchsde",
  "torchvision",
  "numpy>=1.25.0",
  "einops",
  "transformers>=4.50.3",
  "tokenizers>=0.13.3",
  "sentencepiece",
  "safetensors>=0.4.2",
  "aiohttp>=3.11.8",
  "yarl>=1.18.0",
  "pyyaml",
  "Pillow>=10.1.0",
  "scipy",
  "tqdm",
  "psutil",
  "alembic",
  "SQLAlchemy>=2.0.0",
  "filelock",
  "av>=17.0.0",
  "comfy-aimdo==0.6.0",
  "comfy-kitchen==0.2.41",
  "requests",
  "simpleeval>=1.0.0",
  "blake3",
  "kornia>=0.7.1",
  "spandrel",
  "pydantic~=2.0",
  "pydantic-settings~=2.0",
  "PyOpenGL>=3.1.8",
  "comfy-angle",
]

[tool.uv]
package = false
exclude-newer = "P7D"
constraint-dependencies = [
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "setuptools==84.1.0",
  "pillow>=13.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
