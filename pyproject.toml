[project]
name = "comfyui"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  # https://github.com/Comfy-Org/ComfyUI/blob/ebf6b52e322664af91fcdc8b8848d31d5fb98f66/requirements.txt
  "comfyui-frontend-package==1.41.21",
  "comfyui-workflow-templates==0.9.26",
  "comfyui-embedded-docs==0.4.3",
  "torch",
  "torchsde",
  "torchvision",
  "torchaudio",
  "numpy>=1.25.0",
  "einops",
  "transformers>=4.50.3",
  "tokenizers>=0.13.3",
  "sentencepiece",
  "safetensors>=0.4.2",
  "aiohttp>=3.11.8",
  "yarl>=1.18.0",
  "pyyaml",
  "Pillow",
  "scipy",
  "tqdm",
  "psutil",
  "alembic",
  "SQLAlchemy",
  "filelock",
  "av>=14.2.0",
  "comfy-kitchen>=0.2.8",
  "comfy-aimdo>=0.2.12",
  "requests",
  "simpleeval>=1.0.0",
  "blake3",
  "kornia>=0.7.1",
  "spandrel",
  "pydantic~=2.0",
  "pydantic-settings~=2.0",
  "PyOpenGL",
  "glfw",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
