[project]
name = "comfyui"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  # https://github.com/Comfy-Org/ComfyUI/blob/98cc0bf84b7cb1383654c5b402e7612d875d6d22/requirements.txt
  "comfyui-frontend-package==1.55.17",
  "comfyui-workflow-templates==0.11.84",
  "comfyui-embedded-docs==0.5.14",
  "torch",
  "torchsde",
  "torchvision",
  "numpy>=1.25.0",
  "einops",
  "transformers>=4.50.3",
  "tokenizers>=0.13.3",
  "sentencepiece",
  "safetensors>=0.4.2",
  "aiohttp>=3.11.8",
  "yarl>=1.18.0",
  "pyyaml",
  "Pillow",
  "scipy",
  "tqdm",
  "psutil",
  "alembic",
  "SQLAlchemy>=2.0.0",
  "filelock",
  "av>=17.0.0",
  "comfy-kitchen==0.2.37",
  "comfy-aimdo==0.5.6",
  "requests",
  "simpleeval>=1.0.0",
  "blake3",
  "kornia>=0.7.1",
  "spandrel",
  "pydantic~=2.0",
  "pydantic-settings~=2.0",
  "PyOpenGL>=3.1.8",
  "comfy-angle",
]

[tool.uv]
package = false
exclude-newer = "P7D"
# Temporary exceptions for upstream security fixes; remove after 2026-10-27 UTC.
# https://github.com/certifi/python-certifi/security/advisories/GHSA-6q48-6c7w-9gw2
# https://github.com/tox-dev/filelock/security/advisories/GHSA-2g95-wg33-c5x2
# https://github.com/pypa/setuptools/security/advisories/GHSA-xmj3-9gf7-h52w
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", filelock = "2026-10-18T00:00:00Z", setuptools = "2026-10-20T00:00:00Z" }
constraint-dependencies = [
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "setuptools==84.1.0",
  "pillow>=13.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
